name: Environment variables
on: 
  workflow_dispatch:

env:
  APP_NAME: ecomMerce-app

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: TESTING

    steps:
      - name: print variables
        env:
          VERSION: "1.0"
        run: |
          echo "Application: $APP_NAME"
          echo "Environment: $ENVIRONMENT"
          echo "Version: $VERSION"
